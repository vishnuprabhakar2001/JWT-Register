services:
  mongodb:
    image: mongo:7
    container_name: organisation-admin-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: organisation-admin-api:local
    container_name: organisation-admin-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      PORT: 8002
      MONGO_URI: mongodb://mongodb:27017
      ORGANISATIONADMIN_DB_NAME: OrganisationAdmin_database
      SUPERADMIN_MONGO_URI: mongodb://reckomate-mongodb:27017
      SUPERADMIN_DB_NAME: reckomate_superadmin
      FIREBASE_PROJECT_ID: reckomate-organ
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
    volumes:
      # your code is read from your PC, so JS changes need no rebuild
      - ./src:/app/src
      - ./index.js:/app/index.js
      - /app/node_modules
      # uploaded files survive container re-creation
      - ./uploads:/app/uploads
      # Firebase credentials mounted read-only from host
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - default
      - superadmin-shared

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: organisation-admin-api:local
    container_name: organisation-admin-notification-worker
    restart: unless-stopped
    command: ["node", "src/workers/notificationWorker.js"]
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      ORGANISATIONADMIN_DB_NAME: OrganisationAdmin_database
      SUPERADMIN_MONGO_URI: mongodb://reckomate-mongodb:27017
      SUPERADMIN_DB_NAME: reckomate_superadmin
      FIREBASE_PROJECT_ID: reckomate-organ
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
    volumes:
      - ./src:/app/src
      - ./index.js:/app/index.js
      - /app/node_modules
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - default
      - superadmin-shared

volumes:
  mongodb_data:

networks:
  superadmin-shared:
    external: true
    name: superadmin-shared
